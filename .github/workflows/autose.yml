# autose: issue in, reviewed pull request out.
# Design: architecture/decisions/ADR-001..012. Agent code: workflow/autose/.
# A copy of this file is kept in workflow/autose.yml, as the brief asks.

name: autose

on:
  issues:
    types: [labeled]          # a maintainer adds the label "autose"
  issue_comment:
    types: [created]          # "/autose" on an issue (full run) or on an autose PR (review only)
  workflow_dispatch:          # used by the route job to start the next review round
    inputs:
      issue:
        description: Issue number
        required: true
      round:
        description: Review round (1 or 2)
        default: "1"
      resume_from:
        description: First stage to (re)run
        default: S1
        type: choice
        options: [S1, S2, S3]

permissions: {}               # every job asks for what it needs (ADR-005)

jobs:
  gate:
    # ADR-010: cheap, no secrets. Decides whether this event may start a run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      mode: ${{ steps.gate.outputs.mode }}
      issue: ${{ steps.gate.outputs.issue }}
      round: ${{ steps.gate.outputs.round }}
      resume_from: ${{ steps.gate.outputs.resume_from }}
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: workflow
          persist-credentials: false
      - id: gate
        env:
          PYTHONPATH: workflow
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m autose.gate

  build:
    # Stages 1-5 in one job, driven by the coded state machine (ADR-002).
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: autose-issue-${{ needs.gate.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: write         # autose-state branch only; the code branch is pushed with the PAT
      issues: write           # progress comment
      pull-requests: read
      checks: read            # wait for CI
      actions: read           # read failing CI job logs
    outputs:
      pr: ${{ steps.orchestrate.outputs.pr }}
      head_sha: ${{ steps.orchestrate.outputs.head_sha }}
    steps:
      - name: Check out the workflow code (always from main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _autose
          sparse-checkout: workflow
          persist-credentials: false
      - name: Check out the working copy for the agents
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the state branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" autose-state >/dev/null; then
            git clone -q --depth 1 -b autose-state "https://github.com/${GITHUB_REPOSITORY}.git" state
          else
            git init -q state && git -C state checkout -q --orphan autose-state
            git -C state remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project and test tools
        working-directory: work
        run: python -m pip install -q -e '.[testing]' flake8
      - id: orchestrate
        name: Run stages 1-5
        env:
          PYTHONPATH: _autose/workflow
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOSE_PAT: ${{ secrets.AUTOSE_PAT }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          ROUND: ${{ needs.gate.outputs.round }}
          RESUME_FROM: ${{ needs.gate.outputs.resume_from }}
        run: >
          python -m autose.orchestrator --issue "$ISSUE" --round "$ROUND" --resume-from "$RESUME_FROM"
          --work work --state state --out out --logs logs
      - name: Upload stage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-issue-${{ needs.gate.outputs.issue }}-round-${{ needs.gate.outputs.round }}
          path: out/
          if-no-files-found: ignore
      - name: Upload agent transcripts (for audit; never given to other agents)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-transcripts-issue-${{ needs.gate.outputs.issue }}-round-${{ needs.gate.outputs.round }}
          path: logs/
          if-no-files-found: ignore

  review:
    # Stage 6: independent reviewer. Read-only code access, no PAT (ADR-008).
    needs: [gate, build]
    if: >
      always() && needs.gate.outputs.run == 'true' &&
      ((needs.gate.outputs.mode == 'full' && needs.build.result == 'success') ||
       needs.gate.outputs.mode == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: autose-issue-${{ needs.gate.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write    # post the review
      issues: read
    steps:
      - name: Check out the workflow code (always from main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _autose
          sparse-checkout: workflow
          persist-credentials: false
      - name: Check out the pull request at its latest commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.head_sha || format('refs/pull/{0}/head', needs.gate.outputs.pr) }}
          path: work
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project (so the reviewer can run tests if it wants)
        working-directory: work
        run: python -m pip install -q -e '.[testing]' flake8
      - name: Review
        env:
          PYTHONPATH: _autose/workflow
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.build.outputs.pr || needs.gate.outputs.pr }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          ROUND: ${{ needs.gate.outputs.round }}
          VARIANT: ${{ needs.gate.outputs.mode == 'review' && needs.gate.outputs.resume_from || 'default' }}
        run: >
          python -m autose.review --pr "$PR" --issue "$ISSUE" --round "$ROUND" --variant "$VARIANT"
          --work work --out review
      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-review-issue-${{ needs.gate.outputs.issue }}-round-${{ needs.gate.outputs.round }}-pr${{ needs.gate.outputs.pr || 'auto' }}
          path: review/
          if-no-files-found: ignore

  route:
    # Saves the review and starts the next round if needed. No LLM (ADR-002).
    needs: [gate, review]
    if: always() && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write         # autose-state branch
      issues: write           # comment on the issue
      actions: write          # workflow_dispatch for the next round
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _autose
          sparse-checkout: workflow
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autose-review-issue-${{ needs.gate.outputs.issue }}-round-${{ needs.gate.outputs.round }}-pr${{ needs.gate.outputs.pr || 'auto' }}
          path: review
      - name: Check out the state branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" autose-state >/dev/null; then
            git clone -q --depth 1 -b autose-state "https://github.com/${GITHUB_REPOSITORY}.git" state
          else
            git init -q state && git -C state checkout -q --orphan autose-state
            git -C state remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
      - name: Route
        env:
          PYTHONPATH: _autose/workflow
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          ROUND: ${{ needs.gate.outputs.round }}
        run: python3 -m autose.route --issue "$ISSUE" --round "$ROUND" --review-dir review --state state
